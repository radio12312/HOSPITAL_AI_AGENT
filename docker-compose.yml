services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://hospital:hospital@db:5432/hospital
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LLM_CACHE_DIR: /app/state/llm-cache
    volumes:
      - state:/app/state   # generated CSVs, trained models, LLM response cache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
  state:
